name: CI/CD - CatalogAPI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ECR_REPOSITORY: catalog-api

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CatalogApi
        uses: actions/checkout@v4
        with:
          path: CatalogApi

      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Shared
          path: Shared

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build API
        run: dotnet build CatalogApi/CatalogAPI.csproj --configuration Release

      - name: Build & Run Unit Tests
        run: dotnet test CatalogApi/CatalogAPI.Tests/CatalogAPI.Tests.csproj --configuration Release --verbosity normal

  docker-push-and-deploy:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - name: Checkout CatalogApi
        uses: actions/checkout@v4
        with:
          path: CatalogApi

      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Shared
          path: Shared

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image (Local for Security Scan)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: CatalogApi/Dockerfile
          load: true
          push: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Set Kubernetes Context
        if: env.KUBE_CONFIG != ''
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ env.KUBE_CONFIG }}

      - name: Deploy to Kubernetes (Rolling Update)
        if: env.KUBE_CONFIG != ''
        run: |
          kubectl set image deployment/catalog-api catalog-api=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} -n gamestore
          kubectl rollout status deployment/catalog-api -n gamestore

          