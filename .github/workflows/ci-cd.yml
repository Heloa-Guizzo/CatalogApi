name: CI/CD - CatalogAPI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/catalog-api

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CatalogApi
        uses: actions/checkout@v4
        with:
          path: CatalogApi

      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Shared
          path: Shared

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build API
        run: dotnet build CatalogApi/CatalogAPI.csproj --configuration Release

      - name: Build & Run Unit Tests
        run: dotnet test CatalogApi/CatalogAPI.Tests/CatalogAPI.Tests.csproj --configuration Release --verbosity normal

  docker-push-and-deploy:
    needs: build-and-test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout CatalogApi
        uses: actions/checkout@v4
        with:
          path: CatalogApi

      - name: Checkout Shared
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Shared
          path: Shared

      - name: Build Docker Image (Local for Security Scan)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: CatalogApi/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set Kubernetes Context
        if: env.KUBE_CONFIG != ''
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ env.KUBE_CONFIG }}

      - name: Deploy to Kubernetes (Rolling Update)
        if: env.KUBE_CONFIG != ''
        run: |
          kubectl set image deployment/catalog-api catalog-api=${{ env.IMAGE_NAME }}:${{ github.sha }} -n gamestore
          kubectl rollout status deployment/catalog-api -n gamestore